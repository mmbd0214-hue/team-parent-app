name: Mobile and API validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: team_mobile_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:55432/team_mobile_test
      TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:55432/team_mobile_test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/migrate.py --bootstrap
      - run: pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check static/app.js
      - run: node --check static/admin.js
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter build apk --debug --dart-define-from-file=config/development.example.json
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --no-codesign --dart-define-from-file=config/production.example.json
